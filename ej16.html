<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="salida">   </div>
    <script>
        let alumno = {
            nombre: "Juan",
            apellido: "Ramos",
            edad: 20,
            telefono: "654321987"
        };
        let alumno2 = {
            nombre: "Lola",
            apellido: "Mento",
            edad: 22,
            telefono: "654321447"
        };

        let curso = [{a : 7, b: "hola"}];
        curso.push(alumno);
        curso.push(alumno2);

        let textoSalida = "";
        for (let i = 0; i < curso.length; i++) {
            textoSalida += "Alumno " + (i + 1) + ":<br>";
            for (let clave in curso[i]) {
                textoSalida += clave + ": " + curso[i][clave] + "<br>";
            }
            textoSalida += "<br>";
        }

        document.querySelector("#salida").innerHTML = textoSalida;        

    </script>
</body>
</html>
